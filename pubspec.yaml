name: bg_location_tracker
description: "A comprehensive background location and geofence tracking package for Flutter."
version: 1.0.0
# publish_to: 'none'

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  flutter_background_geolocation: ^5.0.4
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  device_info_plus: ^12.3.0
  flutter_local_notifications: ^17.2.4
  async: ^2.11.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
